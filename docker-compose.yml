name: stockflow

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockflow}
      POSTGRES_USER: ${POSTGRES_USER:-stockflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockflow-local}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - stockflow_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-stockflow}:${POSTGRES_PASSWORD:-stockflow_local}@db:5432/${POSTGRES_DB:-stockflow}?sslmode=disable
      HTTP_ADR: :8080
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  stockflow_data: